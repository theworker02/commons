name: COMMONS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commons-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm install --prefix frontend --no-audit --no-fund

      - name: Validate backend independently
        run: npm run check --prefix backend

      - name: Run isolated API integration and fuzz suite
        run: npm run test

      - name: Build frontend independently
        run: npm run build --prefix frontend

      - name: Validate root compatibility commands
        run: npm run check

      - name: Validate route metadata
        run: npm run check:routes

      - name: Validate evidence manifest
        run: npm run evidence:check

      - name: Validate deployment metadata
        run: npm run deploy:check

      - name: Validate bootstrap contract
        run: npm run bootstrap

      # Was a ~1,500 character inline `node -e`. It could not be run locally
      # without copying it out of YAML, and it kept asserting the existence of
      # vercel.json and backend/railway.json for a while after both were deleted,
      # which is how CI ended up red on a change that was actually correct.
      - name: Validate JSON and repository metadata
        run: node scripts/validation/validate-repository-metadata.js

      # ---- Cloudflare gates. All static: no account, no credentials, no cost.

      # Fails if wrangler.jsonc has drifted into anything that needs a paid plan
      # or that could produce a bill instead of an error.
      - name: Verify the deployment stays on the free plan
        run: npm run cf:guard

      # NOTE: D1 migration validation is NOT here. It needs node:sqlite, which
      # requires Node 22.5+, and this job deliberately runs on Node 20 because
      # that is the minimum the application declares in engines. See the `schema`
      # job below.

      # The route inventory is the input to the parity gate, so it is regenerated
      # rather than trusted. A drift here means the extractor and the kernel
      # disagree.
      - name: Regenerate the legacy route inventory
        run: npm run audit:legacy

      # Every domain in the route inventory must carry an explicit storage
      # decision. A new domain with no recorded decision fails the build, which is
      # what stops the compatibility table becoming an invisible junk drawer.
      - name: Verify the parity ledger is current
        run: npm run parity:ledger:check

      # The published API contract is generated from the implementation. This
      # fails if the contract would build differently than what is committed.
      - name: Verify the API contract is not stale
        run: npm run api:check

  # D1 schema validation, on its own job and its own Node version.
  #
  # The validator applies every migration to a real in-memory SQLite database via
  # node:sqlite, which landed in Node 22.5. The `validate` job above pins Node 20
  # on purpose — that is the floor declared in engines and backend/config/
  # release.json, and the application has to work there.
  #
  # Raising that job to Node 22 to satisfy a development tool would quietly stop
  # testing the runtime the project claims to support. So the tool gets its own
  # job instead. It is a build-time check on SQL text; it ships nothing, and the
  # Node version it runs on has no bearing on what the Worker executes.
  #
  # Runs in parallel with `validate`, so this costs no wall-clock time.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 22 for node:sqlite. Not 20 (no node:sqlite) and not `latest`, which
      # would make the job's behaviour drift without a commit.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify runtime
        run: |
          node --version
          node -e "require('node:sqlite'); console.log('node:sqlite available')"

      # Applies all migrations in order to an in-memory database and checks
      # ordering, gap-free versioning, resolvable foreign keys, primary keys,
      # duplicate index names, and that every table the parity ledger claims for a
      # normalized domain actually exists.
      #
      # No Cloudflare account, no credentials, no network, no cost.
      - name: Validate D1 migrations
        run: npm run db:validate

      - name: Publish the resolved schema
        run: node scripts/cloudflare/validate-migrations.mjs --json --out artifacts/schema-cloudflare.json

      - name: Upload the schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-schema
          path: artifacts/schema-cloudflare.json
          if-no-files-found: error
