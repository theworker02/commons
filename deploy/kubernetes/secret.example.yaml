# TEMPLATE ONLY - do not commit a real value and do not apply this file as is.
#
# COMMONS_INFRASTRUCTURE_OPERATOR_TOKEN is a human-operated freeze control, not
# an agent credential. Production requires at least 32 characters.
#
# Create it out of band instead of storing it in version control:
#
#   kubectl -n commons create secret generic commons-secrets \
#     --from-literal=COMMONS_INFRASTRUCTURE_OPERATOR_TOKEN="$(openssl rand -base64 48)"
#
# Or manage it with an external secret store (AWS Secrets Manager via the
# Secrets Store CSI driver, External Secrets Operator, SOPS, or similar).
apiVersion: v1
kind: Secret
metadata:
  name: commons-secrets
  namespace: commons
  labels:
    app.kubernetes.io/name: commons
    app.kubernetes.io/component: api
type: Opaque
stringData:
  COMMONS_INFRASTRUCTURE_OPERATOR_TOKEN: "replace-with-at-least-32-random-characters"
